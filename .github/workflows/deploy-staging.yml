name: Deploy Staging

# Fires after CI passes on main. Treated by Ship Hub as the staging
# validation signal: build succeeds = code is "in staging". The
# deployment_status webhook advances the release from in_staging ->
# verifying immediately; the deploy-workflow poller (2-min cadence)
# covers the backup path if the webhook is delayed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Queue; never cancel in progress -- a build cancellation mid-run would
# leave the release stranded in in_staging with no retry.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_PATH_EXTRAS: /usr/local/bin
  COMPOSE_FILES: -f docker-compose.selfhost.yml -f docker-compose.selfhost.build.yml

jobs:
  deploy:
    name: Build + validate staging images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, mac-mini-prod]
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      MULTICA_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Materialize operator .env
        run: |
          if [ -f "${HOME}/multica-deploy.env" ]; then
            cp "${HOME}/multica-deploy.env" .env
          fi

      - name: Create staging deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.workflow_run.head_sha }}',
              environment: 'staging',
              description: 'Staging validation - CI passed on main',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            if (!data?.id) {
              core.setFailed('createDeployment returned no id');
              return;
            }
            core.setOutput('deployment_id', data.id);

      - name: Build backend image
        run: |
          export PATH="${DOCKER_PATH_EXTRAS}:${PATH}"
          docker compose ${COMPOSE_FILES} build backend

      - name: Build frontend image
        run: |
          export PATH="${DOCKER_PATH_EXTRAS}:${PATH}"
          docker compose ${COMPOSE_FILES} build frontend

      - name: Mark staging deployment success
        if: success() && steps.deployment.outputs.deployment_id
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'success',
              description: 'Staging validation passed',
              environment: 'staging',
              auto_inactive: true,
            });

      - name: Mark staging deployment failure
        if: failure() && steps.deployment.outputs.deployment_id
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Staging validation failed',
              environment: 'staging',
            });
