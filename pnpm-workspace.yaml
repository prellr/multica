packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Core React
  react: "19.2.3"
  react-dom: "19.2.3"
  "@types/react": "^19.2.0"
  "@types/react-dom": "^19.2.0"

  # shadcn headless chat primitives (MessageScroller behavior, ROA-1160)
  "@shadcn/react": "^0.1.0"

  # TypeScript & Node
  typescript: "^5.9.3"
  "@types/node": "^25.0.10"

  # State Management
  zustand: "^5.0.0"
  "@tanstack/react-query": "^5.96.2"
  "@tanstack/react-table": "^8.21.3"

  # Runtime schema validation (defensive boundary against API drift —
  # see CLAUDE.md "API Response Compatibility")
  zod: "^4.1.5"

  # Fuzzy text matching — powers the draft-annotation re-anchoring engine
  # (packages/core/drafts/reanchor.ts): match_main / Levenshtein similarity to
  # relocate an annotation's quote as the document body is edited.
  diff-match-patch: "^1.0.5"
  "@types/diff-match-patch": "^1.0.36"

  # Drafts Yjs co-editing floor (slice 3a). The CRDT layer under the Tiptap
  # draft editor: collaboration extensions bind the editor to a shared Y.Doc.
  # VERSION TRAP — extension-collaboration / -caret are PINNED to 3.22.1 (no
  # caret). >=3.24.0 drags @tiptap/core + @tiptap/pm to a newer exact version
  # and forces a suite-wide bump. y-tiptap is the v3 y-prosemirror successor
  # (pulls lib0); keep yjs / lib0 / y-protocols single-versioned via the catalog.
  yjs: "^13.6"
  "@tiptap/y-tiptap": "^3.0.2"
  "@tiptap/extension-collaboration": "3.22.1"
  "@tiptap/extension-collaboration-caret": "3.22.1"
  y-protocols: "^1"

  # UI & Styling
  tailwindcss: "^4"
  "@tailwindcss/postcss": "^4"
  "@tailwindcss/vite": "^4"
  tailwind-merge: "^3.4.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  katex: "^0.16.45"
  rehype-katex: "^7.0.1"
  remark-math: "^6.0.0"
  mermaid: "^11.14.0"

  # Animation (MIT). The modern, tree-shakeable successor to framer-motion —
  # imports come from "motion/react". Used by chat (views) and the Drafts
  # narration rail's Fluid Functionalism components (ui). Cataloged so both
  # packages pin one version (the FF registry ships framer-motion imports we
  # retarget to motion/react on copy-in).
  motion: "^12.38.0"

  # Icons
  lucide-react: "^1.0.1"

  # i18n
  i18next: "^26.0.8"
  react-i18next: "^17.0.6"
  "@formatjs/intl-localematcher": "^0.8.4"
  eslint-plugin-i18next: "^6.1.4"

  # Loading animations (chat StatusPill)
  unicode-animations: "^1.0.3"

  # Virtualized timeline (issue detail comments)
  react-virtuoso: "^4.14.0"

  # Product analytics
  posthog-js: "^1.176.1"

  # Testing
  vitest: "^4.1.0"
  jsdom: "^29.0.1"
  "@vitejs/plugin-react": "^6.0.1"
  "@testing-library/react": "^16.3.2"
  "@testing-library/jest-dom": "^6.9.1"
  "@testing-library/user-event": "^14.6.1"
