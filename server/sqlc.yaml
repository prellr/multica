version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        # pgvector — the `vector` column type isn't known to sqlc out
        # of the box; map it to pgvector-go's Vector which implements
        # the pgx Scanner / Valuer contract. nullable=true so
        # memory_artifact.embedding (NULL until the worker fills it)
        # round-trips as a pointer.
        overrides:
          - db_type: "vector"
            # pgvector-go's actual Go package name is "pgvector" (per the
            # package declaration in every file in that module), but the
            # import path ends in `pgvector-go`. sqlc's short-form
            # override fails to parse the hyphen — the structured form
            # is required. The trailing sed in the Makefile drops the
            # spurious duplicate import sqlc emits as a side-effect.
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
              pointer: true
